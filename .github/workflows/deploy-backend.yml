# Deploys the Supabase backend (database changes + server functions + secrets) on every push to main
# that touches supabase/, and on demand from the Actions tab ("Run workflow").
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD   (required)
#   SARVAM_API_KEY, LLM_API_KEY, GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, APP_URL   (optional)
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      # If the Supabase GitHub integration deploys this repo instead, these secrets are left unset and
      # this workflow steps aside (green, with a note) rather than failing on every push.
      - name: Check required secrets
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase secrets not set in GitHub, so this workflow is skipped (fine if the Supabase GitHub integration deploys the project)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.run == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.cfg.outputs.run == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database changes
        if: steps.cfg.outputs.run == 'true'
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Set server secrets
        if: steps.cfg.outputs.run == 'true'
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          args=()
          for name in SARVAM_API_KEY LLM_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET APP_URL; do
            value="$(printf '%s' "${!name}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$value" ] && args+=("$name=$value")
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --yes --project-ref "$PROJECT_REF" "${args[@]}"
          else
            echo "No optional secrets set; the app reads invoices with the simulated engine until SARVAM_API_KEY is added."
          fi

      - name: Deploy server functions
        if: steps.cfg.outputs.run == 'true'
        run: supabase functions deploy --yes --project-ref "$PROJECT_REF" --use-api
